server {
    listen 80;
    listen [::]:80;
    server_name game.example.com;
    root /var/www/game.example.com/htdocs;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://game.example.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name game.example.com;
    ssl_certificate /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/key.pem;
    root /var/www/game.example.com/htdocs;
    index index.html;
    access_log /var/log/nginx/game.example.com.access.log;
    error_log /var/log/nginx/game.example.com.error.log;
    client_max_body_size 1m;
    keepalive_timeout 65s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    location ^~ /api/awards/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 75s;
        proxy_send_timeout 20s;
        add_header Cache-Control "no-store" always;
    }
    location ~ /\. { return 404; }
    location ~* \.(?:json|sqlite|csv|env|mjs|map)$ { return 404; }
    location /assets/ { try_files $uri =404; expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; }
    location /awards/nominees/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-store" always; }
}
